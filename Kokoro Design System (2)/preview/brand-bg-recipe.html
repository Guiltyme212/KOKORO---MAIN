<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Background recipe</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:var(--font-mono)}
  .card{padding:0;width:700px;height:240px;box-sizing:border-box;position:relative;overflow:hidden;background:radial-gradient(80% 70% at 50% 60%, #27130d 0%, #0a0908 60%)}
  .ch{position:absolute;font-family:"Noto Serif JP",serif;color:var(--ink);opacity:.07;font-size:120px;line-height:1}
  .a{top:-10px;left:30px}
  .b{top:50px;right:40px;font-size:90px}
  .c{bottom:-30px;left:200px;font-size:140px}
  .d{bottom:30px;right:120px;font-size:80px}
  .lbl{position:absolute;left:24px;top:24px;font:500 11px/1 var(--font-mono);letter-spacing:.18em;text-transform:uppercase;color:var(--ink-muted);z-index:2}
  .demo{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-family:var(--font-serif);font-style:italic;font-size:30px;color:var(--ink);text-align:center;line-height:1.1;z-index:2}
</style></head>
<body><div class="card">
  <span class="lbl">— bg recipe —</span>
  <span class="ch a">感</span><span class="ch b">思</span><span class="ch c">光</span><span class="ch d">志</span>
  <div class="demo">Radial glow + low-opacity kanji watermarks</div>
</div></body></html>
