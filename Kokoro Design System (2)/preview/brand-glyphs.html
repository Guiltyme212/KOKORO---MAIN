<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Kanji glyphs</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:var(--font-mono)}
  .card{padding:18px 28px;width:700px;box-sizing:border-box;display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
  .g{display:flex;flex-direction:column;align-items:center;gap:6px;padding:6px 0;border:1px solid var(--ink-faint);border-radius:12px}
  .ch{font-family:"Noto Serif JP",serif;font-size:34px;color:var(--ink);line-height:1}
  .lbl{font:400 9px/1 var(--font-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-muted)}
</style></head>
<body><div class="card">
  <div class="g"><span class="ch" style="color:var(--primary)">心</span><span class="lbl">heart</span></div>
  <div class="g"><span class="ch">感</span><span class="lbl">feel</span></div>
  <div class="g"><span class="ch">思</span><span class="lbl">think</span></div>
  <div class="g"><span class="ch">光</span><span class="lbl">light</span></div>
  <div class="g"><span class="ch">道</span><span class="lbl">way</span></div>
  <div class="g"><span class="ch">志</span><span class="lbl">will</span></div>
  <div class="g"><span class="ch">静</span><span class="lbl">still</span></div>
  <div class="g"><span class="ch">夢</span><span class="lbl">dream</span></div>
</div></body></html>
