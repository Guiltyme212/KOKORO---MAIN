<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Icons</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:var(--font-mono)}
  .card{padding:24px 28px;width:700px;box-sizing:border-box;display:flex;gap:24px;align-items:center;justify-content:space-around}
  .i{display:flex;flex-direction:column;align-items:center;gap:8px;color:var(--ink)}
  .lbl{font:500 10px/1 var(--font-mono);letter-spacing:.16em;text-transform:uppercase;color:var(--ink-muted)}
</style></head>
<body><div class="card">
  <div class="i" style="color:var(--primary)"><img src="../assets/logomark.svg" width="40" height="40"><span class="lbl">Logomark</span></div>
  <div class="i"><img src="../assets/icons/mic.svg" width="28" height="28" style="filter:invert(1) brightness(.95)"><span class="lbl">Mic</span></div>
  <div class="i" style="color:#fff"><img src="../assets/icons/play.svg" width="28" height="28" style="filter:invert(1) brightness(.95)"><span class="lbl">Play</span></div>
  <div class="i"><img src="../assets/icons/plus.svg" width="24" height="24" style="filter:invert(1) brightness(.95)"><span class="lbl">Plus</span></div>
  <div class="i"><img src="../assets/icons/chevron-left.svg" width="24" height="24" style="filter:invert(1) brightness(.95)"><span class="lbl">Back</span></div>
</div></body></html>
