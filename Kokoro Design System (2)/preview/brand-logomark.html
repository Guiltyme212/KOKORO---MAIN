<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Logomark</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:var(--font-mono)}
  .card{padding:30px 28px;width:700px;box-sizing:border-box;display:flex;gap:32px;align-items:center;justify-content:center}
  .word{display:flex;flex-direction:column;align-items:center;gap:6px}
  .k{font-family:var(--font-serif);font-style:italic;font-weight:500;font-size:42px;letter-spacing:.36em;color:var(--ink);padding-left:.36em}
  .sub{font:400 10px/1 var(--font-mono);letter-spacing:.32em;text-transform:uppercase;color:var(--ink-muted);display:flex;gap:10px;align-items:center}
  .sub::before{content:"心";font-family:"Noto Serif JP",serif;color:var(--primary);font-size:13px;letter-spacing:0}
  img{filter:drop-shadow(0 0 14px rgba(200,76,43,.25))}
</style></head>
<body><div class="card">
  <img src="../assets/logomark.svg" width="80" height="80" alt="">
  <div class="word">
    <div class="k">KOKORO</div>
    <div class="sub">夢 · The heart-mind</div>
  </div>
</div></body></html>
