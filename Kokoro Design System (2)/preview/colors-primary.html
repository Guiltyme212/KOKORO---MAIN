<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Colors — Primary</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:var(--font-mono)}
  .card{padding:24px 28px;width:700px;box-sizing:border-box;display:flex;gap:14px}
  .sw{flex:1;border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;justify-content:space-between;height:90px;border:1px solid rgba(255,255,255,.04)}
  .name{font:500 10px/1 var(--font-mono);letter-spacing:.16em;text-transform:uppercase;color:#fff}
  .hex{font:500 12px/1 var(--font-mono);letter-spacing:.08em;color:rgba(255,255,255,.85)}
</style></head>
<body><div class="card">
  <div class="sw" style="background:#c84c2b"><span class="name">Primary</span><span class="hex">#C84C2B</span></div>
  <div class="sw" style="background:#e25a36"><span class="name">Primary · hot</span><span class="hex">#E25A36</span></div>
  <div class="sw" style="background:#7a3520"><span class="name">Primary · dim</span><span class="hex">#7A3520</span></div>
  <div class="sw" style="background:#b04a3c"><span class="name">Danger</span><span class="hex">#B04A3C</span></div>
</div></body></html>
