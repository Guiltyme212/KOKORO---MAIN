<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Colors — Surfaces</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:var(--font-mono)}
  .card{padding:24px 28px;width:700px;box-sizing:border-box;display:flex;gap:14px}
  .sw{flex:1;border-radius:14px;padding:14px 16px;height:90px;display:flex;flex-direction:column;justify-content:space-between;border:1px solid var(--ink-faint)}
  .name{font:500 10px/1 var(--font-mono);letter-spacing:.16em;text-transform:uppercase;color:var(--ink)}
  .hex{font:500 12px/1 var(--font-mono);letter-spacing:.08em;color:var(--ink-muted)}
</style></head>
<body><div class="card">
  <div class="sw" style="background:#0a0908"><span class="name">bg</span><span class="hex">#0A0908</span></div>
  <div class="sw" style="background:#110b09"><span class="name">bg · 1</span><span class="hex">#110B09</span></div>
  <div class="sw" style="background:#1a100c"><span class="name">bg · 2</span><span class="hex">#1A100C</span></div>
  <div class="sw" style="background:radial-gradient(80% 80% at 50% 50%, #27130d 0%, #0a0908 70%)"><span class="name">bg · glow</span><span class="hex">radial</span></div>
</div></body></html>
