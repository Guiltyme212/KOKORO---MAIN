<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Buttons</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:var(--font-mono)}
  .card{padding:24px 28px;width:700px;box-sizing:border-box;display:flex;flex-direction:column;gap:14px}
  .row{display:flex;gap:14px;align-items:center}
  .lbl{font:500 10px/1 var(--font-mono);letter-spacing:.16em;text-transform:uppercase;color:var(--ink-muted);width:120px;flex-shrink:0}
  .btn-pri{background:var(--primary);color:#fff;border:none;padding:14px 32px;border-radius:999px;font:500 13px/1 var(--font-mono);letter-spacing:.16em;text-transform:uppercase;cursor:pointer}
  .btn-pri:hover{background:var(--primary-hot)}
  .btn-out{background:transparent;color:var(--ink);border:1px solid var(--ink-faint);padding:13px 32px;border-radius:999px;font:500 13px/1 var(--font-mono);letter-spacing:.16em;text-transform:uppercase;cursor:pointer}
  .btn-sec{background:var(--primary);color:#fff;border:none;padding:11px 24px;border-radius:999px;font-family:var(--font-serif);font-style:italic;font-weight:500;font-size:16px;cursor:pointer}
  .lnk{font:500 12px/1 var(--font-mono);letter-spacing:.16em;text-transform:uppercase;color:var(--ink-soft);background:none;border:none;cursor:pointer;padding:8px 0}
</style></head>
<body><div class="card">
  <div class="row"><span class="lbl">Primary</span><button class="btn-pri">Begin</button><button class="btn-pri">Compose my meditation</button></div>
  <div class="row"><span class="lbl">Outline</span><button class="btn-out">Begin</button></div>
  <div class="row"><span class="lbl">Secondary</span><button class="btn-sec">Compose one</button><button class="btn-sec">Try again</button></div>
  <div class="row"><span class="lbl">Mono link</span><button class="lnk">← Back</button><button class="lnk">Library</button><button class="lnk">No story · Just reset me</button></div>
</div></body></html>
