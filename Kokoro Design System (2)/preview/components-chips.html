<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Chips</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:var(--font-mono)}
  .card{padding:24px 28px;width:700px;box-sizing:border-box;display:flex;flex-direction:column;gap:14px}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .chip{font-family:var(--font-serif);font-style:italic;font-size:18px;padding:10px 22px;border:1px solid var(--ink-faint);color:var(--ink-soft);border-radius:999px;background:transparent;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
  .chip.sel{border-color:var(--primary-dim);color:var(--ink);box-shadow:0 0 16px -6px rgba(200,76,43,.3)}
  .chip .dot{width:5px;height:5px;border-radius:999px;background:var(--primary)}
  .word{font-family:var(--font-serif);font-style:italic;font-size:16px;color:var(--ink-soft);background:none;border:none;cursor:pointer;padding:6px 4px}
  .lbl{font:500 10px/1 var(--font-mono);letter-spacing:.16em;text-transform:uppercase;color:var(--ink-muted)}
</style></head>
<body><div class="card">
  <span class="lbl">Pet-name chips</span>
  <div class="row">
    <button class="chip sel"><span class="dot"></span>By my name</button>
    <button class="chip">Love</button><button class="chip">Babe</button><button class="chip">Honey</button><button class="chip">Sweetheart</button><button class="chip">Sunshine</button><button class="chip">Kitten</button>
  </div>
  <span class="lbl">Reflect words (no border)</span>
  <div class="row" style="gap:18px">
    <button class="word">lighter</button><button class="word">steady</button><button class="word">tired</button><button class="word">clear</button><button class="word">softer</button><button class="word">still</button>
  </div>
</div></body></html>
