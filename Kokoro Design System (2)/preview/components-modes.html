<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Modes — 4 personalities</title>
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="../ui_kits/app/modes.css">
<style>
  html,body{margin:0;padding:0;background:var(--bg);font-family:var(--font-mono)}
  .grid{padding:14px;width:700px;box-sizing:border-box;display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .mode-card{cursor:default}
  .mode-card:hover{transform:none}
</style></head>
<body><div class="grid">
  <button class="mode-card mode-raw"><div class="mode-card-inner">
    <div class="mode-glyph">!?</div>
    <div style="flex:1;position:relative;z-index:2">
      <div class="mode-tag">Gen Z · raw</div>
      <div class="mode-title">no notes. just real shit.</div>
      <div class="mode-desc">slang, swears, zero corporate.</div>
    </div>
  </div></button>
  <button class="mode-card mode-cosmic"><div class="mode-card-inner">
    <div class="mode-glyph">✦</div>
    <div style="flex:1;position:relative;z-index:2">
      <div class="mode-tag">Spiritual · cosmic</div>
      <div class="mode-title">Align with your higher frequency.</div>
      <div class="mode-desc">Astrology, chakras, lunar tides.</div>
    </div>
  </div></button>
  <button class="mode-card mode-iron"><div class="mode-card-inner">
    <div class="mode-glyph">力</div>
    <div style="flex:1;position:relative;z-index:2">
      <div class="mode-tag">Hard mode · iron</div>
      <div class="mode-title">NO EXCUSES. ONLY REPS.</div>
      <div class="mode-desc">Pre-sale · pre-lift · pre-war.</div>
    </div>
  </div></button>
  <button class="mode-card mode-zen"><div class="mode-card-inner">
    <div class="mode-glyph">無</div>
    <div style="flex:1;position:relative;z-index:2">
      <div class="mode-tag">Zen · 禅</div>
      <div class="mode-title">Sit. Breathe. Watch it pass.</div>
      <div class="mode-desc">One breath, then the next.</div>
    </div>
    <div class="ensō"></div>
  </div></button>
</div></body></html>
