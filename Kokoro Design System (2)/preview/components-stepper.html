<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Step indicator</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:var(--font-mono)}
  .card{padding:30px 28px;width:700px;box-sizing:border-box;display:flex;flex-direction:column;gap:18px;align-items:center}
  .stepper{display:flex;align-items:center;gap:0;border:1px solid var(--ink-faint);border-radius:999px;padding:6px 10px;background:#0a0908}
  .pip{width:24px;height:22px;display:flex;align-items:center;justify-content:center;font:500 10px/1 var(--font-mono);letter-spacing:.04em;color:var(--ink-muted);border-radius:999px}
  .pip.active{background:var(--primary);color:#fff}
  .lbl{font:500 10px/1 var(--font-mono);letter-spacing:.16em;text-transform:uppercase;color:var(--ink-muted)}
</style></head>
<body><div class="card">
  <div class="stepper">
    <div class="pip">01</div><div class="pip">02</div><div class="pip active">03</div><div class="pip">04</div><div class="pip">05</div><div class="pip">06</div><div class="pip">07</div><div class="pip">08</div>
  </div>
  <div class="lbl">8 pips · active capsule fill primary · inactive ink-muted</div>
</div></body></html>
