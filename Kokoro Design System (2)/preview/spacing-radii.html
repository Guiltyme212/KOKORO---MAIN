<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Radii</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:var(--font-mono)}
  .card{padding:24px 28px;width:700px;box-sizing:border-box;display:flex;gap:18px;align-items:flex-end}
  .sw{display:flex;flex-direction:column;align-items:center;gap:8px}
  .box{width:80px;height:80px;background:#1a100c;border:1px solid var(--ink-faint)}
  .name{font:500 10px/1 var(--font-mono);letter-spacing:.16em;text-transform:uppercase;color:var(--ink)}
  .px{font:400 11px/1 var(--font-mono);color:var(--ink-muted)}
  .pill{height:40px;width:160px;border-radius:999px;background:var(--primary);display:flex;align-items:center;justify-content:center;font:500 11px/1 var(--font-mono);letter-spacing:.16em;color:#fff;text-transform:uppercase}
</style></head>
<body><div class="card">
  <div class="sw"><div class="box" style="border-radius:4px"></div><span class="name">r-1</span><span class="px">4px</span></div>
  <div class="sw"><div class="box" style="border-radius:8px"></div><span class="name">r-2</span><span class="px">8px</span></div>
  <div class="sw"><div class="box" style="border-radius:12px"></div><span class="name">r-3</span><span class="px">12px</span></div>
  <div class="sw"><div class="box" style="border-radius:20px"></div><span class="name">r-card</span><span class="px">20px</span></div>
  <div class="sw"><div class="pill">Pill · 999px</div><span class="name">r-pill</span><span class="px">capsule</span></div>
</div></body></html>
