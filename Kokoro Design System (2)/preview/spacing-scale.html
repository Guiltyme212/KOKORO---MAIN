<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Spacing</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:var(--font-mono)}
  .card{padding:24px 28px;width:700px;box-sizing:border-box;display:flex;flex-direction:column;gap:10px}
  .row{display:flex;align-items:center;gap:16px}
  .bar{background:var(--primary);height:8px;border-radius:2px}
  .name{font:500 11px/1 var(--font-mono);letter-spacing:.12em;text-transform:uppercase;width:60px;color:var(--ink)}
  .px{font:400 11px/1 var(--font-mono);color:var(--ink-muted);width:50px}
</style></head>
<body><div class="card">
  <div class="row"><span class="name">s-1</span><span class="px">4</span><div class="bar" style="width:4px"></div></div>
  <div class="row"><span class="name">s-2</span><span class="px">8</span><div class="bar" style="width:8px"></div></div>
  <div class="row"><span class="name">s-3</span><span class="px">12</span><div class="bar" style="width:12px"></div></div>
  <div class="row"><span class="name">s-4</span><span class="px">16</span><div class="bar" style="width:16px"></div></div>
  <div class="row"><span class="name">s-5</span><span class="px">24</span><div class="bar" style="width:24px"></div></div>
  <div class="row"><span class="name">s-6</span><span class="px">32</span><div class="bar" style="width:32px"></div></div>
  <div class="row"><span class="name">s-7</span><span class="px">48</span><div class="bar" style="width:48px"></div></div>
  <div class="row"><span class="name">s-8</span><span class="px">64</span><div class="bar" style="width:64px"></div></div>
</div></body></html>
