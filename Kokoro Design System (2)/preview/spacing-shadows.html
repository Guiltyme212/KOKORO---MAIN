<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Shadows / Glow</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:var(--font-mono)}
  .card{padding:30px 28px;width:700px;box-sizing:border-box;display:flex;gap:24px;align-items:center}
  .sw{display:flex;flex-direction:column;align-items:center;gap:10px;flex:1}
  .box{width:140px;height:60px;background:#0a0908;border:1px solid var(--ink-faint);border-radius:20px;display:flex;align-items:center;justify-content:center;font-family:var(--font-serif);font-style:italic;color:var(--ink);font-size:15px}
  .name{font:500 10px/1 var(--font-mono);letter-spacing:.16em;text-transform:uppercase;color:var(--ink-muted);text-align:center}
</style></head>
<body><div class="card">
  <div class="sw"><div class="box">resting</div><span class="name">No shadow</span></div>
  <div class="sw"><div class="box" style="border-color:var(--primary);box-shadow:0 0 24px -8px rgba(200,76,43,.35)">selected</div><span class="name">Glow · 24px</span></div>
  <div class="sw"><div class="box" style="border-color:var(--primary);box-shadow:0 0 40px -10px rgba(200,76,43,.55)">active</div><span class="name">Glow · strong</span></div>
</div></body></html>
