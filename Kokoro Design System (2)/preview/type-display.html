<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Type — Display</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:var(--font-mono)}
  .card{padding:24px 28px;width:700px;box-sizing:border-box;display:flex;flex-direction:column;gap:8px}
  .label{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-muted);font-family:var(--font-mono)}
  .specimen{font-family:var(--font-serif);font-style:italic;font-weight:500;color:var(--ink);line-height:1.05;letter-spacing:-0.01em}
  .meta{font-size:11px;color:var(--ink-muted);font-family:var(--font-mono);letter-spacing:.08em;text-transform:uppercase;margin-top:6px}
</style></head>
<body>
<div class="card">
  <div class="label">Display · 44px · Cormorant Garamond Italic 500</div>
  <div class="specimen" style="font-size:44px">What is your kokoro holding?</div>
  <div class="meta">font-family: var(--font-serif) · italic 500 · -0.01em · line-height 1.05</div>
</div>
</body></html>
