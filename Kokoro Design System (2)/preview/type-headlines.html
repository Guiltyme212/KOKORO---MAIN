<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Type — Headlines</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:var(--font-mono)}
  .card{padding:20px 28px;width:700px;box-sizing:border-box;display:flex;flex-direction:column;gap:14px}
  .row{display:flex;align-items:baseline;gap:18px}
  .tag{font:500 10px/1 var(--font-mono);letter-spacing:.16em;text-transform:uppercase;color:var(--ink-muted);width:70px;flex-shrink:0}
  .s{font-family:var(--font-serif);font-style:italic;font-weight:500;color:var(--ink);line-height:1.1;letter-spacing:-0.01em}
</style></head>
<body><div class="card">
  <div class="row"><span class="tag">H1 · 32</span><span class="s" style="font-size:32px">Tap to begin when you're ready.</span></div>
  <div class="row"><span class="tag">H2 · 26</span><span class="s" style="font-size:26px">Soft. Like talking to someone who gets it.</span></div>
  <div class="row"><span class="tag">H3 · 20</span><span class="s" style="font-size:20px">Cinematic. Rehearse the life you're building.</span></div>
</div></body></html>
