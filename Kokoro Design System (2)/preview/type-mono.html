<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Type — Mono labels</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:var(--font-mono)}
  .card{padding:24px 28px;width:700px;box-sizing:border-box;display:flex;flex-direction:column;gap:18px}
  .lbl{font:500 10px/1 var(--font-mono);letter-spacing:.16em;text-transform:uppercase;color:var(--ink-muted)}
  .row{display:flex;flex-direction:column;gap:6px}
  .eyebrow{font:500 12px/1 var(--font-mono);letter-spacing:.16em;text-transform:uppercase;color:var(--primary);display:inline-flex;gap:8px;align-items:center}
  .eyebrow::before,.eyebrow::after{content:"—";opacity:.7}
  .meta{font:400 11px/1 var(--font-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-muted)}
  .label-strong{font:500 12px/1 var(--font-mono);letter-spacing:.16em;text-transform:uppercase;color:var(--ink)}
  .label-soft{font:500 12px/1 var(--font-mono);letter-spacing:.16em;text-transform:uppercase;color:var(--ink-muted)}
</style></head>
<body><div class="card">
  <div class="row"><span class="lbl">Eyebrow · primary</span><span class="eyebrow">Welcome</span></div>
  <div class="row"><span class="lbl">Label · ink</span><span class="label-strong">How to call you</span></div>
  <div class="row"><span class="lbl">Label · muted</span><span class="label-soft">Or something softer</span></div>
  <div class="row"><span class="lbl">Meta · separator</span><span class="meta">Takes 90 seconds · Private</span></div>
</div></body></html>
