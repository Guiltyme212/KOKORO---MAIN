<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Type — Prose & emphasis</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:var(--font-mono)}
  .card{padding:24px 28px;width:700px;box-sizing:border-box}
  .prose{font-family:var(--font-serif);font-style:italic;font-weight:400;font-size:22px;line-height:1.45;color:var(--ink);text-wrap:pretty}
  .emph{color:var(--primary)}
</style></head>
<body><div class="card">
  <p class="prose">You are not being dramatic. You are carrying <span class="emph">anger, pressure,</span> and the feeling that nobody really saw how much <span class="emph">effort</span> you put in <span class="emph">today</span>.</p>
</div></body></html>
